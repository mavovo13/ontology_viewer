<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ontology Viewer</title>
  <link rel="stylesheet" href="src/css/style.css">
  <script src="https://unpkg.com/cytoscape@3.31.0/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/cytoscape-elk@2.2.0/cytoscape-elk.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <h1 class="app-header__title">Ontology Viewer</h1>
      <nav id="view-toggle" class="view-toggle" aria-label="ビュー切り替え">
        <button class="view-toggle__btn" data-view="W_CONCEPTS">W_CONCEPTS</button>
        <button class="view-toggle__btn" data-view="R_CONCEPTS">R_CONCEPTS</button>
      </nav>
    </header>

    <main class="app-body">
      <div class="graph-area">
        <div id="drop-zone" class="drop-zone" role="button" aria-label="XMLファイルをドロップ">
          <div class="drop-zone__inner">
            <span class="drop-zone__icon" aria-hidden="true">📂</span>
            <p class="drop-zone__text">XMLファイルをここにドロップ</p>
            <p class="drop-zone__sub">または</p>
            <span class="drop-zone__btn">ファイルを選択</span>
          </div>
        </div>

        <input type="file" id="file-input" accept=".xml,application/xml,text/xml" style="display:none" aria-label="XMLファイルを選択">

        <div id="w-concepts-container" class="graph-container" aria-label="W_CONCEPTSグラフ"></div>
        <div id="r-concepts-container" class="graph-container" aria-label="R_CONCEPTSグラフ"></div>

        <div id="file-name-bar" class="file-name-bar" aria-live="polite"></div>

        <button id="fit-btn" class="fit-btn" aria-label="グラフ全体を表示">全体表示</button>

        <div id="error-banner" class="error-banner" role="alert" aria-live="assertive"></div>
      </div>

      <aside id="side-panel" class="side-panel" aria-label="概念詳細">
        <div class="side-panel__header">
          <span class="side-panel__header-title">概念詳細</span>
          <button class="side-panel__close" aria-label="パネルを閉じる">×</button>
        </div>
        <div class="side-panel__content"></div>
      </aside>
    </main>
  </div>

  <script src="src/js/state/AppState.js"></script>
  <script src="src/js/logic/XMLParser.js"></script>
  <script src="src/js/logic/GraphBuilder.js"></script>
  <script src="src/js/components/FileUploader.js"></script>
  <script src="src/js/components/ViewToggle.js"></script>
  <script src="src/js/components/SidePanel.js"></script>
  <script src="src/js/views/WConceptsView.js"></script>
  <script src="src/js/views/RConceptsView.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
