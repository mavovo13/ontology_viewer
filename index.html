<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ontology Viewer ▸ NOSTROMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=VT323&family=Major+Mono+Display&display=swap">
  <link rel="stylesheet" href="src/css/style.css">
  <script src="https://unpkg.com/cytoscape@3.31.0/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/elkjs@0.8.2/lib/elk.bundled.js"></script>
  <script src="https://unpkg.com/cytoscape-elk@2.2.0/dist/cytoscape-elk.js"></script>
  <script>cytoscape.use(cytoscapeElk);</script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div style="display:flex;align-items:center;">
        <h1 class="app-header__title">Ontology&nbsp;Viewer</h1>
      </div>

      <nav id="view-toggle" class="view-toggle" aria-label="ビュー切り替え">
        <button class="view-toggle__btn" data-view="W_CONCEPTS">W_CONCEPTS</button>
        <button class="view-toggle__btn" data-view="R_CONCEPTS">R_CONCEPTS</button>
      </nav>
    </header>

    <main class="app-body">
      <div class="graph-area">
        <div class="reticle"></div>

        <div class="viewport-tag viewport-tag--tl">▸ VIEWPORT <span class="v" id="hud-view-label">W_CONCEPTS</span></div>
        <div class="viewport-tag viewport-tag--bl">NODES <span class="v" id="hud-nodes">000</span> ┃ EDGES <span class="v" id="hud-edges">000</span></div>
        <div class="viewport-tag viewport-tag--br">LAYOUT <span class="v">ELK</span></div>

        <div id="drop-zone" class="drop-zone" role="button" aria-label="XMLファイルをドロップ">
          <div class="drop-zone__inner">
            <span class="drop-zone__icon" aria-hidden="true">[ ◇◇◇ ]</span>
            <p class="drop-zone__text">Drop XML payload here</p>
            <p class="drop-zone__sub">or</p>
            <span class="drop-zone__btn">SELECT FILE</span>
            <div style="margin-top:18px;font-size:10px;color:var(--txt-mute);letter-spacing:0.18em;">
              FORMATS · .XML &nbsp;·&nbsp; .OWL &nbsp;·&nbsp; .RDF
              <span class="drop-zone__cursor"></span>
            </div>
          </div>
        </div>

        <input type="file" id="file-input" accept=".xml,application/xml,text/xml" style="display:none" aria-label="XMLファイルを選択">

        <div id="w-concepts-container" class="graph-container" aria-label="W_CONCEPTSグラフ"></div>
        <div id="r-concepts-container" class="graph-container" aria-label="R_CONCEPTSグラフ" style="display:none"></div>

        <div id="file-name-bar" class="file-name-bar" aria-live="polite"></div>

        <button id="fit-btn" class="fit-btn" aria-label="グラフ全体を表示">FIT VIEW</button>

        <div id="error-banner" class="error-banner" role="alert" aria-live="assertive"></div>
      </div>

      <aside id="side-panel" class="side-panel" aria-label="概念詳細">
        <div class="side-panel__header">
          <span class="side-panel__header-title">CONCEPT&nbsp;·&nbsp;READOUT</span>
          <button class="side-panel__close" aria-label="パネルを閉じる">✕</button>
        </div>
        <div class="side-panel__content"></div>
      </aside>
    </main>
  </div>

  <script src="src/js/state/AppState.js"></script>
  <script src="src/js/logic/XMLParser.js"></script>
  <script src="src/js/logic/GraphBuilder.js"></script>
  <script src="src/js/components/FileUploader.js"></script>
  <script src="src/js/components/ViewToggle.js"></script>
  <script src="src/js/components/SidePanel.js"></script>
  <script src="src/js/views/WConceptsView.js"></script>
  <script src="src/js/views/RConceptsView.js"></script>
  <script src="src/js/app.js"></script>

</body>
</html>
